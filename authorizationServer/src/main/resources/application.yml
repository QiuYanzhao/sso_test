server:
  port: 8080

spring:
  application:
    name: authorization-server
  thymeleaf:
    cache: false

  # ===== Spring Security OAuth2 Client 第三方登录配置 =====
  security:
    oauth2:
      client:
        registration:
          # ----- GitHub OAuth2（标准 OAuth2，与 Spring Security 无缝集成）-----
          github:
            client-id: your-github-client-id
            client-secret: your-github-client-secret
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          # ----- 微信开放平台扫码登录 -----
          wechat:
            client-id: your-wechat-app-id
            client-secret: your-wechat-app-secret
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/wechat"
            scope: snsapi_login
            client-name: 微信

          # ----- QQ 互联 OAuth2 登录 -----
          qq:
            client-id: your-qq-app-id
            client-secret: your-qq-app-secret
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/qq"
            scope: get_user_info
            client-name: QQ

        provider:
          # GitHub 使用默认 provider，无需额外配置
          # （Spring Security 内置了 github 的 provider 配置）

          # 微信 provider（非标准 OAuth2，需手动指定各端点）
          wechat:
            authorization-uri: https://open.weixin.qq.com/connect/qrconnect
            token-uri: https://api.weixin.qq.com/sns/oauth2/access_token
            user-info-uri: https://api.weixin.qq.com/sns/userinfo
            user-name-attribute: openid

          # QQ provider
          qq:
            authorization-uri: https://graph.qq.com/oauth2.0/authorize
            token-uri: https://graph.qq.com/oauth2.0/token
            user-info-uri: https://graph.qq.com/user/get_user_info
            user-name-attribute: openid

logging:
  level:
    org.springframework.security: DEBUG
    com.example: DEBUG
